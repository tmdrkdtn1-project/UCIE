name: Stage 1 and 3 Offline Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.15']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install standalone dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation (no external code executed)
        run: python -m compileall -q src tests scripts/public_miner_cycle.py
      - name: Public-only offline unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: CLI is importable
        run: python -m ucie_public.cli --help
        env:
          PYTHONPATH: src
      - name: Parse PowerShell scheduler syntax (never install task in CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install_hourly_task.ps1', 'scripts/task_status.ps1', 'scripts/remove_hourly_task.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: UCIE-owned CPython bounded behavioral regression probes (no upstream checkout)
        run: python tests/runtime_python_probes.py
      - name: UCIE-owned PowerShell bounded behavioral observations (ephemeral runner only)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/runtime_powershell_probes.ps1

name: Stage 1 Offline Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.15']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install standalone dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation (no external code executed)
        run: python -m compileall -q src tests
      - name: Public-only offline unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: CLI is importable
        run: python -m ucie_public.cli --help
        env:
          PYTHONPATH: src

name: Stage 1 and 3 Offline Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read # Read-only access for pinned public upstream artifact trial

jobs:
  offline:
    name: Offline test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.13', '3.15']
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install standalone dependencies
        run: python -m pip install -r requirements.txt
      - name: Syntax compilation (no external code executed)
        run: python -m compileall -q src tests scripts/public_miner_cycle.py
      - name: Public-only offline unit tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: CLI is importable
        run: python -m ucie_public.cli --help
        env:
          PYTHONPATH: src
      - name: Parse PowerShell scheduler syntax (never install task in CI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('scripts/install_hourly_task.ps1', 'scripts/task_status.ps1', 'scripts/remove_hourly_task.ps1', 'scripts/ucie_stage10_operator_readonly_trial.ps1', 'scripts/ucie_unattended_host_readonly_preflight.ps1', 'scripts/ucie_unattended_identity_acl_readonly_v2.ps1')) {
            $tokens = $null
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              exit 1
            }
          }

      - name: Hourly task read-only evidence acceptance with synthetic Windows PowerShell 5.1 task
        if: runner.os == 'Windows'
        shell: pwsh
        run: powershell.exe -NoProfile -NonInteractive -File ./tests/test_ucie_task_status_evidence.ps1
      - name: UCIE-owned CPython bounded behavioral regression probes (no upstream checkout)
        run: python tests/runtime_python_probes.py
      - name: Verify pinned public candidate safe QA against LIVE GitHub CI (one-shot PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/candidate-safe-automated-qa-verifier-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        run: python -B tests/runtime_public_candidate_qa_live.py
      - name: Fourth rule safe scandir guarded runtime and inert AST positives and negatives
        run: python -B tests/runtime_python_scandir_rule_probe.py
      - name: Fourth rule exact official release-versus-patch source proof (one-shot PR only)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/fourth-rule-scandir-source-and-safe-regression-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        run: python -B tests/runtime_python_scandir_pinned_source.py
      - name: First rule real CPython 3.15 -X runtime regression (ephemeral runner only)
        if: matrix.python-version == '3.15'
        run: python tests/runtime_python_xoption_regression.py
      - name: Download pinned upstream PowerShell patched public CI build (single PR trial)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/powershell-dotpath-postfix-evidence-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '11634185748'
          repository: PowerShell/PowerShell
          run-id: 37965704591
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ucie_public_ps_build
      - name: Verify upstream patched Resolve-Path behavior in disposable CI (single PR trial)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/powershell-dotpath-postfix-evidence-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        run: python -B tests/runtime_powershell_dotpath_postfix.py "${{ runner.temp }}/ucie_public_ps_build"
      - name: UCIE-owned PowerShell bounded behavioral observations (ephemeral runner only)
        if: ${{ always() && runner.os == 'Windows' }}
        shell: pwsh
        run: ./tests/runtime_powershell_probes.ps1
      - name: Third rule Get-Command fuzzy duplicates behavioral observation (disposable runner, no approval)
        if: matrix.python-version == '3.15'
        shell: pwsh
        run: ./tests/runtime_powershell_fuzzy_probe.ps1
      - name: Download fixed public PowerShell development CI build for third rule (one-shot PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/third-rule-real-fuzzy-regression-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        uses: actions/download-artifact@v8
        with:
          artifact-ids: '11634185748'
          repository: PowerShell/PowerShell
          run-id: 37965704591
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/ucie_public_ps_fuzzy
      - name: Third rule fixed fuzzy behavior in official post-fix developer build (one-shot PR)
        if: github.event_name == 'pull_request' && github.head_ref == 'core/third-rule-real-fuzzy-regression-20261018' && runner.os == 'Linux' && matrix.python-version == '3.15'
        run: python -B tests/runtime_powershell_fuzzy_postfix.py "${{ runner.temp }}/ucie_public_ps_fuzzy"
      - name: Second rule actual Resolve-Path dot-prefix behavior (disposable runner, no approval)
        if: matrix.python-version == '3.15'
        shell: pwsh
        run: ./tests/runtime_powershell_dotpath_probe.ps1
      - name: UCIE-authored inert PowerShell AST candidate tests (no user code)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_ucie_powershell_static_candidates.ps1
      - name: UCIE-authored PowerShell synthetic detector calibration (not production accuracy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_ucie_powershell_static_accuracy.ps1
      - name: Signed review Rulepack to inert scanner consumer (ephemeral synthetic Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_ucie_signed_review_consumer.ps1
      - name: Signed review consumer on Windows PowerShell 5.1 (ephemeral synthetic)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_ucie_signed_review_consumer.ps1
      - name: Stage4 QA plus owner signed production consumer (synthetic only)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_ucie_stage4_production_consumer.ps1
      - name: Owner-risk automated QA public consumer (synthetic Windows 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_ucie_owner_risk_consumer.ps1
      - name: UCIE PowerShell alias and shadowing synthetics (never execute supplied code)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/test_ucie_powershell_flow_shadowing.ps1

      - name: Stage 10 explicit one-shot public API acceptance on ephemeral Windows 3.15
        if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'stage10-windows-live-public-acceptance-20261014' && runner.os == 'Windows' && matrix.python-version == '3.15'
        shell: pwsh
        env:
          PYTHONPATH: src
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          $script = @'
          import json
          from pathlib import Path
          from ucie_miner.public_batch import build_public_batch, review_batch_preview
          from ucie_miner.public_candidate_staging import stage_public_candidates
          from ucie_miner.public_skill_digest import compare_public_skill_batches
          from ucie_miner.public_discovery import SOURCES

          # One-shot ACTUAL anonymous public GitHub API reads on disposable
          # GitHub Windows runner. No local UCIE owner PC or external code execution.
          paths = [Path("runtime/public_miner.sqlite3"),
                   Path("runtime/knowledge.sqlite3"),
                   Path("runtime/stage10_unverified_public_candidates.sqlite3")]
          before = {str(p): (p.read_bytes() if p.is_file() else None) for p in paths}
          result = build_public_batch(
              sources=("modelcontextprotocol/python-sdk", "git/git"),
              include_git_commits=True, include_docs=False,
              include_advisories=False, backfill_pages=1, max_enrich=1,
          )
          review = review_batch_preview(result)
          staged = stage_public_candidates(result)  # SQLite :memory: ONLY
          digest = compare_public_skill_batches(result)
          after = {str(p): (p.read_bytes() if p.is_file() else None) for p in paths}
          assert before == after, "read-only acceptance unexpectedly mutated UCIE runtime"
          assert result["metadata_gets_budget"] == 2
          assert result["git_commit_gets_budget"] == 1
          assert result["overall_gets_upper_bound"] == 5
          assert result["operating_database_writes"] == 0
          assert result["new_scheduler_registered"] is False
          assert result["production_approved"] is False
          assert staged["mode"] == "EPHEMERAL_MEMORY_ONLY"
          assert staged["production_approved"] is False
          assert review["production_approved"] is False
          assert digest["production_approved"] is False
          assert set(result["sources_fetched"]).issubset(set(SOURCES))
          print("UCIE_REAL_PUBLIC_WINDOWS_RUNNER_ACCEPTANCE=" + json.dumps({
              "status": "EPHEMERAL_WINDOWS_PUBLIC_API_READS_VERIFIED",
              "platform": "GITHUB_ACTIONS_WINDOWS_RUNNER_NOT_OWNER_HOST",
              "metadata_requests": result["metadata_gets_budget"],
              "git_commit_requests": result["git_commit_gets_budget"],
              "public_pr_candidates": result["public_metadata_candidate_count"],
              "public_pr_enriched": result["enriched_count"],
              "git_direct_commit_skill_leads": result["git_commit_lead_count"],
              "separate_unverified_pr_rows_in_memory": staged["total_staged_revisions"],
              "separate_unverified_git_rows_in_memory": staged["git_commit_total_revisions"],
              "candidate_skill_digest_count": digest["candidate_count"],
              "operating_databases_unchanged": True,
              "external_code_executed": False,
              "source_content_persisted": False,
              "owner_windows_host_attested": False,
              "independent_upstream_fix_verified": False,
              "production_approved": False,
          }, sort_keys=True))
          '@
          $script | python -B -

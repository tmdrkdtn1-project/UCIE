name: UCIE V2 G3 isolated Chromium first-use acceptance

on:
  pull_request:
    branches:
      - feature/ucie-v2-g0g2-first-use-functional-20261126
    paths:
      - src/ucie_miner/ucie_v2_beginner_preview_v01.py
      - src/ucie_miner/ucie_v2_first_use_linked_v01.py
      - tests/test_ucie_v2_g3_isolated_browser_v01.py
      - tests/test_ucie_v2_first_use_linked_v01.py
      - .github/workflows/ucie-v2-g3-isolated-browser.yml

permissions:
  contents: read

jobs:
  isolated-chromium-first-use:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UCIE_G3_BROWSER_QA: "1"
      UCIE_G3_OUTPUT_DIR: ./_ucie_g3_browser
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout exact PR head, not default branch or parent CI
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Python 3.15 for isolated first-party test
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"

      - name: Identify installed, disposable runner browser
        run: |
          command -v google-chrome || command -v chromium
          (google-chrome --version || chromium --version)

      - name: Install pinned local-browser controller only
        run: python -m pip install --disable-pip-version-check --no-cache-dir playwright==1.58.0

      - name: Real Chromium first-use keyboard, navigation, strict CSP and zoom
        run: python -B -m unittest discover -s tests -p test_ucie_v2_g3_isolated_browser_v01.py -v

      - name: Publish only UCIE-authored synthetic browser screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucie-g3-first-party-isolated-chromium-${{ github.run_id }}
          path: ./_ucie_g3_browser/
          retention-days: 7
          if-no-files-found: warn
